<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + Vue + Typescript App</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        min-width: 320px;
        min-height: 100vh;
        background: #0f0d14;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #f6f3f8;
        background:
          radial-gradient(circle at 50% 36%, rgba(124, 92, 255, 0.18), transparent 28%),
          linear-gradient(180deg, #15111d 0%, #0f0d14 100%);
        font-family: Inter, 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif;
      }

      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-10px);
      }

      .boot-logo {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      }

      .boot-title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .boot-loader {
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .boot-loader::before {
        content: '';
        display: block;
        width: 42px;
        height: 100%;
        border-radius: inherit;
        background: #8f73ff;
        animation: boot-loading 1.1s ease-in-out infinite;
      }

      @keyframes boot-loading {
        0% {
          transform: translateX(-48px);
          opacity: 0.55;
        }

        50% {
          opacity: 1;
        }

        100% {
          transform: translateX(118px);
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot-screen" aria-label="Game Shift 正在启动">
        <div class="boot-card">
          <img class="boot-logo" src="/src/assets/brand-icon.png" alt="" />
          <p class="boot-title">Game Shift</p>
          <div class="boot-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
